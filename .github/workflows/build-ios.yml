# KiraLegacy —— 在 GitHub Actions 上构建 iOS 包
#
# 放到仓库的 .github/workflows/build-ios.yml 即生效。
#
# 跑在 ubuntu-22.04 上，全程不需要 macOS、Xcode，也不需要苹果开发者证书：
# Theos 自带 iOS clang 工具链和 ldid，签名走 adhoc。
#
# 冷启动约 25–35 分钟（工具链 86 MB、SDK 约 200 MB、OpenSSL 编译 5–10 分钟），
# 命中缓存后约 3–5 分钟。公开仓库免费，不计入付费分钟数。
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: /home/runner/theos
  SSL_OUT: /home/runner/kiralegacy/out
  OPENSSL_VERSION: "1.1.1w"
  # 换工具链或改了 SDK 补丁后，把这个值 +1 可强制重建缓存
  CACHE_EPOCH: v1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      # setup.sh 只在「缺工具」时才调 apt，而 runner 上 git/curl/perl/make/
      # python3/dpkg-deb 本来就有，它会整段跳过安装。所以依赖在这里显式装齐。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl git zip xz-utils \
            libxml2 dpkg-dev python3 ca-certificates
          # 工具链的 clang 依赖第五代 ncurses，新发行版里已删除；
          # 用第六代顶替，这也是 Theos 官方文档给的办法。
          sudo apt-get install -y libtinfo5 || true
          if ! ldconfig -p | grep -q 'libtinfo\.so\.5'; then
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 \
                        /lib/x86_64-linux-gnu/libtinfo.so.5
            sudo ldconfig
          fi

      # 先建目录，否则缓存动作在未命中时会报路径不存在的警告
      - name: 建好缓存目录
        run: mkdir -p "$THEOS" "$SSL_OUT"

      - name: 缓存 Theos（工具链 + SDK 9.3 + 补丁）
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ env.CACHE_EPOCH }}

      - name: 缓存 OpenSSL 静态库
        uses: actions/cache@v4
        with:
          path: ${{ env.SSL_OUT }}
          key: openssl-${{ runner.os }}-${{ env.OPENSSL_VERSION }}-${{ env.CACHE_EPOCH }}

      # Theos、工具链、iPhoneOS9.3.sdk、四处 SDK 补丁、OpenSSL 双切片
      - name: 准备环境
        run: |
          set -o pipefail

          if sh tools/setup.sh; then
            exit 0
          fi

          # 工具链里的 ar 是带 program-prefix 的 GNU ar：建符号表时它会去找
          # 同前缀的 ranlib，而包里只有不带前缀的那个。于是 OpenSSL 编到
          # 「打包静态库」那一步就断，报的是：
          #   ar: can't find or exec: .../aarch64-apple-darwin14-ranlib
          # 补上这个缺失的别名再跑一次；setup.sh 幂等，已装好的部分会跳过，
          # 只会重做失败的 OpenSSL。
          BIN="$THEOS/toolchain/linux/iphone/bin"
          if [ -d "$BIN" ] && [ ! -e "$BIN/aarch64-apple-darwin14-ranlib" ]; then
            echo "补上工具链缺失的 ranlib 别名"
            ln -sf ranlib "$BIN/aarch64-apple-darwin14-ranlib"
            sh tools/setup.sh
          else
            exit 1
          fi

      # 项目自己的 patch-sdk.sh 给 libsystem_c.tbd 补了 memset/memcpy 家族，
      # 却漏了 strchr/strcmp/strncmp —— 成因完全相同：这三个在 iOS 5.1 也
      # 住在 libsystem_c，新系统里搬去了 libsystem_platform，再由前者导出。
      # armv7 上 OpenSSL 的静态库确实会调用它们，于是链接阶段报
      #   Undefined symbols for architecture armv7: "_strchr", "_strcmp", …
      # 按项目同样的办法补进同一个文件（幂等，重复执行无副作用）。
      - name: 补上 SDK 里缺失的字符串函数符号
        run: |
          TBD="$THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/libsystem_c.tbd"
          # 必须是 YAML 序列，不是裸字符串 —— 写成 "armv7 arm64" 的话
          # 链接器会把整个 .tbd 判为 malformed: not a sequence。
          # 取值与 patch-sdk.sh 里的 ARCHS 保持一致。
          ARCHS="[ armv7, armv7s, arm64, i386, x86_64 ]"
          missing=""

          # 按词边界判断，避免匹配到 __platform_strchr 这类名字
          for sym in strchr strcmp strncmp; do
            grep -qE "(^|[^_A-Za-z0-9])_$sym([,]|[[:space:]]|\])" "$TBD" \
              || missing="$missing _$sym,"
          done

          if [ -z "$missing" ]; then
            echo "libsystem_c.tbd: 字符串函数已在，无需改动"
            exit 0
          fi

          syms=$(echo "$missing" | sed 's/,$//; s/^ //')

          # 去掉末尾的「...」再追加一段，和 patch-sdk.sh 的做法一致
          sed '$ d' "$TBD" > "$TBD.new"
          printf '  - archs:              %s\n    symbols:            [ %s ]\n...\n' \
            "$ARCHS" "$syms" >> "$TBD.new"
          mv "$TBD.new" "$TBD"

          echo "libsystem_c.tbd: 补上$missing"

      - name: 编译并打包
        run: make package ipa

      # 校验平台、最低版本 5.1 和双摘要签名；失败返回非零，任务直接变红
      - name: 校验产物
        run: python3 tools/check-macho.py packages/KiraLegacy.ipa

      - name: 列出产物
        run: ls -l packages/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KiraLegacy-${{ github.sha }}
          path: |
            packages/KiraLegacy.ipa
            packages/*.deb
          if-no-files-found: error
          # ipa 本身已是 zip，再压一遍没有收益
          compression-level: 0

      - name: 打标签时附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/KiraLegacy.ipa
            packages/*.deb
          generate_release_notes: true
